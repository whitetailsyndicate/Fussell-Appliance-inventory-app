name: Check and package iPhone test app
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package
        env:
          INTAKE_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fussell-iPhone-Test
          path: artifacts/Fussell-iPhone-Test.zip
          if-no-files-found: error
